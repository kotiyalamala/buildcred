<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlocBIM | Construction Finance Intelligence</title>
<style>
:root{--navy:#10243a;--navy2:#183653;--blue:#2764d8;--blue2:#eaf1ff;--bg:#f4f7fb;--ink:#172638;--muted:#718096;--line:#e6ebf2;--green:#16845b;--greenbg:#e8f7f0;--amber:#a96809;--amberbg:#fff5df;--red:#bd4141;--white:#fff;--shadow:0 8px 24px rgba(20,42,68,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:var(--navy);color:#d7e2ef;padding:22px 15px;display:flex;flex-direction:column;gap:25px}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:38px;height:38px;border-radius:11px;background:#2d6ce0;display:grid;place-items:center;color:white;font-weight:800;font-size:20px}.brand-name{font-size:19px;font-weight:750;letter-spacing:.2px;color:#fff}.brand-sub{font-size:10px;color:#9fb3c9;letter-spacing:1.15px;text-transform:uppercase}
.workspace{margin:0 8px;padding:12px;border:1px solid #2b435d;border-radius:10px;background:#18314c}.workspace small{display:block;color:#9fb3c9;font-size:10px;text-transform:uppercase;letter-spacing:1px}.workspace strong{display:block;color:#fff;margin-top:4px;font-size:13px}
.nav-label{font-size:10px;letter-spacing:1.3px;color:#8299b2;text-transform:uppercase;padding:0 12px;margin:0 0 7px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#b9c8d8;text-align:left;padding:11px 12px;border-radius:8px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button:hover{background:#1b3856;color:#fff}.nav button.active{background:#2458a4;color:#fff;font-weight:650}.ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #2b435d;padding:15px 8px 0;color:#8fa5bc;font-size:11px}
.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--ink);font-size:13px}.top-actions{display:flex;align-items:center;gap:14px}.search{border:1px solid var(--line);background:#fafbfd;border-radius:8px;padding:9px 12px;width:220px;color:#506174}.icon-btn{border:1px solid var(--line);background:white;border-radius:8px;width:36px;height:36px}.avatar{width:34px;height:34px;border-radius:50%;background:#dce8ff;color:#244e9a;display:grid;place-items:center;font-weight:700}
.content{padding:30px 32px 48px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;color:var(--blue);font-weight:750;letter-spacing:1.2px;text-transform:uppercase}.page-head h1{font-size:25px;line-height:1.2;margin:5px 0 6px;letter-spacing:-.5px}.page-head p{margin:0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#fff;color:#31445a;border-radius:8px;padding:10px 14px;font-weight:650;font-size:12px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1e55bd}.btn:hover{filter:brightness(.98)}.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:31px;height:31px;border-radius:9px;background:#edf3ff;color:#356bd0;display:grid;place-items:center;font-size:16px}.stat-value{font-size:25px;font-weight:750;letter-spacing:-.7px;margin:12px 0 4px}.stat-foot{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.warning{color:var(--amber)}.two-col{grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr)}.section-title{font-size:14px;font-weight:720;margin:0 0 14px}.section-meta{font-size:11px;color:var(--muted);font-weight:450;margin-left:6px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:#8491a1;font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:650;padding:11px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #eef1f5;font-size:12px}tr:last-child td{border-bottom:0}.project-name{font-weight:700;color:#20364e}.sub{display:block;color:var(--muted);font-size:10px;margin-top:3px}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}.status.green{background:var(--greenbg);color:var(--green)}.status.amber{background:var(--amberbg);color:var(--amber)}.status.blue{background:var(--blue2);color:#315fb5}.status.gray{background:#f0f2f5;color:#687789}.dot{width:5px;height:5px;border-radius:50%;background:currentColor}.progress{height:6px;border-radius:10px;background:#edf1f6;overflow:hidden;min-width:75px}.progress span{height:100%;display:block;background:#3974df;border-radius:10px}
.activity{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #eef1f5}.activity:last-child{border:0}.activity-icon{width:29px;height:29px;border-radius:9px;background:#edf3ff;display:grid;place-items:center;color:#356bd0;flex-shrink:0}.activity strong{font-size:11px;display:block}.activity small{font-size:10px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:9px;padding:13px;text-align:left;background:#fff}.quick:hover{border-color:#9ab6ee;background:#f8faff}.quick b{display:block;font-size:12px;margin:7px 0 2px}.quick small{font-size:10px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.field{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:white;color:#34465b;min-width:0}.field.searchfield{width:240px}.table-card{padding:6px 16px 14px;overflow:auto}.table-card table{min-width:650px}
.panel-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.project-card{padding:0;overflow:hidden}.project-cover{height:105px;background:linear-gradient(135deg,#dce9fb,#b9cde9);display:flex;align-items:center;justify-content:center;color:#28528e;font-size:34px}.project-body{padding:16px}.project-body h3{font-size:14px;margin:0 0 5px}.project-body p{font-size:11px;color:var(--muted);margin:0 0 13px}.project-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:12px}
.empty-note{padding:28px;text-align:center;color:var(--muted);font-size:12px}.model-placeholder{height:300px;border-radius:10px;background:linear-gradient(135deg,#e7eef8,#d4e0ef);display:grid;place-items:center;text-align:center;color:#426187;position:relative;overflow:hidden}.model-placeholder:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(61,96,141,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(61,96,141,.08) 1px,transparent 1px);background-size:25px 25px}.model-placeholder div{position:relative}.model-placeholder .building{font-size:78px;line-height:1.2}.model-placeholder strong{display:block;font-size:13px}.model-placeholder small{font-size:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group label{font-size:11px;font-weight:650;color:#526174}.form-group input,.form-group select,.form-group textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}.form-group.full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:rgba(9,24,41,.45);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{background:white;border-radius:14px;width:min(540px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f0f3f7;border-radius:7px;width:30px;height:30px;font-size:18px}.toast{position:fixed;bottom:22px;right:22px;background:#173b2e;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);font-size:12px;display:none;z-index:30}.toast.show{display:block}.mobile-menu{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.panel-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{display:none;position:fixed;z-index:15;inset:0 auto 0 0;width:250px}.sidebar.open{display:flex}.mobile-menu{display:inline-block}.topbar{padding:0 15px}.content{padding:22px 15px}.search{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px}.stat-value{font-size:21px}.page-head{flex-direction:column}.panel-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">B</div><div><div class="brand-name">BlocBIM</div><div class="brand-sub">Construction Finance</div></div></div>
  <div class="workspace"><small>Workspace</small><strong>Northstar Construction ▾</strong></div>
  <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
    <button class="active" data-page="overview"><span class="ico">▦</span>Overview</button>
    <button data-page="projects"><span class="ico">▣</span>Projects</button>
    <button data-page="bim"><span class="ico">⬡</span>BIM Models</button>
    <button data-page="boq"><span class="ico">▤</span>BOQ Management</button>
    <button data-page="milestones"><span class="ico">⚑</span>Milestones</button>
    <button data-page="verification"><span class="ico">✓</span>Progress Verification</button>
  </nav></div>
  <div><div class="nav-label">Finance & trust</div><nav class="nav">
    <button data-page="contracts"><span class="ico">◇</span>Smart Contracts</button>
    <button data-page="payments"><span class="ico">＄</span>Payments</button>
    <button data-page="transactions"><span class="ico">↗</span>Transactions</button>
  </nav></div>
  <div class="side-bottom">BlocBIM MVP 1.0 · Demo workspace<br>Blockchain test mode · No real funds</div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><div class="crumb">Workspace&nbsp; / &nbsp;<strong id="crumb">Overview</strong></div></div>
  <div class="top-actions"><input class="search" placeholder="Search projects, payments…"><button class="icon-btn" title="Notifications" onclick="toast('You are all caught up.')">♧</button><div class="avatar" title="Demo administrator">AK</div></div>
</header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Create project</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const state={
 projects:[
 {name:"Harbour View Tower",code:"BB-2026-001",location:"Dubai, UAE",client:"Northstar Developments",value:1250000,progress:68,status:"In progress"},
 {name:"Westbridge Logistics Hub",code:"BB-2026-002",location:"Manchester, UK",client:"Westbridge Group",value:840000,progress:42,status:"In progress"},
 {name:"Marina Residences",code:"BB-2026-003",location:"Singapore",client:"Marina Property Pte",value:2100000,progress:86,status:"In progress"}
 ],
 milestones:[
 {id:"MS-001",project:"Harbour View Tower",name:"Foundation completion",amount:125000,progress:100,status:"Approved",date:"18 Nov 2026"},
 {id:"MS-002",project:"Harbour View Tower",name:"Podium structure",amount:180000,progress:100,status:"Approved",date:"17 Nov 2026"},
 {id:"MS-003",project:"Westbridge Logistics Hub",name:"Substructure works",amount:95000,progress:75,status:"Under review",date:"16 Nov 2026"},
 {id:"MS-004",project:"Marina Residences",name:"Level 5 slab",amount:160000,progress:55,status:"Pending",date:"15 Nov 2026"}
 ],
 payments:[
 {id:"PAY-1024",project:"Harbour View Tower",milestone:"Foundation completion",amount:125000,status:"Authorized",date:"18 Nov 2026",tx:"0x8b4...a921"},
 {id:"PAY-1023",project:"Harbour View Tower",milestone:"Podium structure",amount:180000,status:"Authorized",date:"17 Nov 2026",tx:"0x9c2...b114"},
 {id:"PAY-1022",project:"Westbridge Logistics Hub",milestone:"Substructure works",amount:95000,status:"Pending approval",date:"16 Nov 2026",tx:"—"}
 ],
 boq:[
 {code:"BOQ-001",description:"Reinforced concrete – foundation",unit:"m³",qty:420,rate:280,project:"Harbour View Tower"},
 {code:"BOQ-002",description:"Reinforcement steel",unit:"tonne",qty:68,rate:1150,project:"Harbour View Tower"},
 {code:"BOQ-003",description:"Formwork to columns and walls",unit:"m²",qty:1250,rate:42,project:"Harbour View Tower"}
 ]
};
const money=n=>"$"+Number(n).toLocaleString("en-US");
const statusClass=s=>s==="Approved"||s==="Authorized"?"green":s==="Under review"||s==="Pending approval"?"amber":s==="In progress"?"blue":"gray";
const badge=s=>`<span class="status ${statusClass(s)}"><i class="dot"></i>${s}</span>`;
const titleMap={overview:"Overview",projects:"Projects",bim:"BIM Models",boq:"BOQ Management",milestones:"Milestones",verification:"Progress Verification",contracts:"Smart Contracts",payments:"Payments",transactions:"Transactions"};
function setPage(page){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("crumb").textContent=titleMap[page];document.getElementById("sidebar").classList.remove("open");render(page)}
function head(kicker,title,desc,actions=""){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="btn-row">${actions}</div></div>`}
function stat(label,value,foot,icon){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`}
function render(page="overview"){
const c=document.getElementById("content");
if(page==="overview"){
c.innerHTML=head("PROJECT CONTROL CENTRE","Good morning, Alex","Here’s the latest view of your construction portfolio.",`<button class="btn" onclick="toast('Report export will be enabled in a later build.')">↓ Export report</button><button class="btn primary" onclick="openProjectModal()">＋ New project</button>`)+
`<div class="grid stats">${stat("Active projects","08",'<span class="positive">↑ 2</span> this quarter',"▣")}${stat("Payment requests","24","Across all active projects","＄")}${stat("Authorized payments",money(420000),'<span class="positive">Verified milestones</span>',"✓")}${stat("Pending approvals",money(85000),'<span class="warning">Requires attention</span>',"◷")}</div>
<div class="grid two-col"><div class="card"><h3 class="section-title">Project portfolio <span class="section-meta">Recently updated</span></h3>${table(["Project","Location","Progress","Contract value","Status"],state.projects.map(p=>`<tr><td><span class="project-name">${p.name}</span><span class="sub">${p.code}</span></td><td>${p.location}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="progress"><span style="width:${p.progress}%"></span></div>${p.progress}%</div></td><td>${money(p.value)}</td><td>${badge(p.status)}</td></tr>`).join(""))}<div style="padding:13px 8px 0"><button class="btn" onclick="setPage('projects')">View all projects →</button></div></div>
<div class="card"><h3 class="section-title">Recent activity</h3><div class="activity"><div class="activity-icon">✓</div><div><strong>Foundation milestone approved</strong><small>Harbour View Tower · 18 Nov, 10:42 AM</small></div></div><div class="activity"><div class="activity-icon">◇</div><div><strong>Payment authorization recorded</strong><small>PAY-1024 · 18 Nov, 10:45 AM</small></div></div><div class="activity"><div class="activity-icon">▣</div><div><strong>New progress submitted</strong><small>Westbridge Logistics Hub · 16 Nov</small></div></div><div class="activity"><div class="activity-icon">⬡</div><div><strong>BIM model synchronized</strong><small>Marina Residences · 15 Nov</small></div></div></div></div>
<div class="grid two-col" style="margin-top:16px"><div class="card"><h3 class="section-title">Payment pipeline</h3>${table(["Payment ID","Milestone","Amount","Status"],state.payments.slice(0,3).map(p=>`<tr><td><b>${p.id}</b></td><td>${p.milestone}<span class="sub">${p.project}</span></td><td>${money(p.amount)}</td><td>${badge(p.status)}</td></tr>`).join(""))}<div style="padding:12px 8px 0"><button class="btn" onclick="setPage('payments')">View payments →</button></div></div><div class="card"><h3 class="section-title">Quick actions</h3><div class="quick-grid"><button class="quick" onclick="openProjectModal()">＋<b>Create project</b><small>Set up a new project</small></button><button class="quick" onclick="setPage('bim')">⬡<b>Upload BIM model</b><small>Import an IFC file</small></button><button class="quick" onclick="openMilestoneModal()">⚑<b>Add milestone</b><small>Define payment stage</small></button><button class="quick" onclick="setPage('verification')">✓<b>Review progress</b><small>Check submissions</small></button></div></div></div>`;
}
if(page==="projects"){
c.innerHTML=head("PORTFOLIO","Projects","Manage construction projects, contracts and delivery progress.",`<button class="btn primary" onclick="openProjectModal()">＋ Create project</button>`)+`<div class="toolbar"><input class="field searchfield" id="projectSearch" placeholder="Search projects…" oninput="filterProjects()"><span class="sub">Showing ${state.projects.length} demo projects</span></div><div class="grid panel-grid" id="projectCards">${projectCards(state.projects)}</div>`;
}
if(page==="bim"){
c.innerHTML=head("DIGITAL MODEL","BIM Models","Upload and review project information models.",`<button class="btn primary" onclick="document.getElementById('ifcInput').click()">↑ Upload IFC model</button>`)+`<input type="file" id="ifcInput" accept=".ifc" hidden onchange="handleIfc(this)"><div class="grid two-col"><div class="card"><h3 class="section-title">Model viewer</h3><div class="model-placeholder"><div><div class="building">▥</div><strong>3D BIM model viewer</strong><small>IFC visualization module planned for the next build</small></div></div><div class="sub" style="margin-top:10px">Demo model · Harbour View Tower · IFC 4</div></div><div class="card"><h3 class="section-title">Model information</h3><p><span class="sub">Selected project</span><b>Harbour View Tower</b></p><p><span class="sub">Model format</span><b>IFC 4</b></p><p><span class="sub">Elements indexed</span><b>1,284 (sample)</b></p><p><span class="sub">Last synchronized</span><b>18 Nov 2026</b></p><button class="btn" onclick="toast('Model properties panel is planned for the IFC integration sprint.')">View model properties</button></div></div>`;
}
if(page==="boq"){
c.innerHTML=head("COST & QUANTITIES","BOQ Management","Connect bill of quantities items to project work packages.",`<button class="btn primary" onclick="openBoqModal()">＋ Add BOQ item</button>`)+`<div class="card table-card">${table(["Item code","Description","Unit","Contract quantity","Rate","Total value","Project"],state.boq.map(b=>`<tr><td><b>${b.code}</b></td><td>${b.description}</td><td>${b.unit}</td><td>${b.qty.toLocaleString()}</td><td>${money(b.rate)}</td><td><b>${money(b.qty*b.rate)}</b></td><td>${b.project}</td></tr>`).join(""))}</div>`;
}
if(page==="milestones"){
c.innerHTML=head("CONTRACT ADMINISTRATION","Milestones","Define contractual stages and link them to payment conditions.",`<button class="btn primary" onclick="openMilestoneModal()">＋ Add milestone</button>`)+`<div class="card table-card">${table(["Milestone ID","Project","Milestone","Amount","Progress","Target date","Status"],state.milestones.map(m=>`<tr><td><b>${m.id}</b></td><td>${m.project}</td><td>${m.name}</td><td>${money(m.amount)}</td><td><div style="display:flex;gap:7px;align-items:center"><div class="progress"><span style="width:${m.progress}%"></span></div>${m.progress}%</div></td><td>${m.date}</td><td>${badge(m.status)}</td></tr>`).join(""))}</div>`;
}
if(page==="verification"){
c.innerHTML=head("QUALITY & PROGRESS","Progress Verification","Review submitted work evidence before payment authorization.")+`<div class="card table-card">${table(["Submission","Project","Milestone","Reported progress","Evidence","Review"],state.milestones.map((m,i)=>`<tr><td><b>SUB-${240+i}</b></td><td>${m.project}</td><td>${m.name}</td><td>${m.progress}%</td><td><button class="btn" onclick="toast('Demo evidence record: site photos and inspection checklist.')">View evidence</button></td><td>${m.status==="Under review"?`<button class="btn primary" onclick="approveMilestone('${m.id}')">Review & approve</button>`:badge(m.status)}</td></tr>`).join(""))}</div>`;
}
if(page==="contracts"){
c.innerHTML=head("BLOCKCHAIN AUTOMATION","Smart Contracts","Manage payment rules and inspect contract execution status.",`<button class="btn primary" onclick="toast('Contract deployment wizard will be added in the blockchain sprint.')">＋ Deploy contract</button>`)+`<div class="grid stats">${stat("Network","Local testnet","Development environment","◇")}${stat("Contracts deployed","01","Demo contract","▣")}${stat("Authorizations","02","Successful demo records","✓")}${stat("Contract status",'<span class="positive">Active</span>',"No real funds connected","●")}</div><div class="card"><h3 class="section-title">Payment contract · BB-MILESTONE-001</h3><p class="sub">Demo contract address</p><b style="font-family:monospace;word-break:break-all">0x71C7656EC7ab88b098defB751B7401B5f6d8976F</b><p class="sub" style="margin-top:14px">Execution rule</p><p>Authorize payment only when consultant approval and client approval are both recorded, and the milestone has not previously been paid.</p><span class="status amber">Simulation mode · Not deployed</span></div>`;
}
if(page==="payments"){
c.innerHTML=head("FINANCIAL OPERATIONS","Payments","Track payment requests, approvals and authorization records.")+`<div class="grid stats">${stat("Authorized",money(state.payments.filter(p=>p.status==="Authorized").reduce((a,p)=>a+p.amount,0)),"Demo payment authorizations","✓")}${stat("Pending",money(state.payments.filter(p=>p.status!=="Authorized").reduce((a,p)=>a+p.amount,0)),"Awaiting approval","◷")}${stat("Payment requests",state.payments.length,"Recorded in this workspace","＄")}${stat("Currency","USD","Demo workspace currency","◎")}</div><div class="card table-card">${table(["Payment ID","Project","Milestone","Amount","Date","Transaction","Status"],state.payments.map(p=>`<tr><td><b>${p.id}</b></td><td>${p.project}</td><td>${p.milestone}</td><td><b>${money(p.amount)}</b></td><td>${p.date}</td><td style="font-family:monospace">${p.tx}</td><td>${badge(p.status)}</td></tr>`).join(""))}</div>`;
}
if(page==="transactions"){
c.innerHTML=head("AUDIT TRAIL","Transactions","Review recorded payment authorization events and blockchain references.")+`<div class="card table-card">${table(["Event","Project","Milestone","Amount","Transaction reference","Network","Status"],state.payments.map(p=>`<tr><td><b>PaymentAuthorized</b></td><td>${p.project}</td><td>${p.milestone}</td><td>${money(p.amount)}</td><td style="font-family:monospace">${p.tx}</td><td>Demo test mode</td><td>${badge(p.status)}</td></tr>`).join(""))}</div><p class="sub" style="margin:12px 3px">Transaction references shown here are illustrative demo data, not verified on-chain transactions.</p>`;
}
}
function projectCards(list){return list.map(p=>`<div class="card project-card"><div class="project-cover">▥</div><div class="project-body"><h3>${p.name}</h3><p>${p.code} · ${p.location}</p><div style="display:flex;justify-content:space-between;font-size:11px"><span>Project progress</span><b>${p.progress}%</b></div><div class="progress" style="margin-top:7px"><span style="width:${p.progress}%"></span></div><div class="project-meta"><span>Contract value</span><b>${money(p.value)}</b></div><div class="project-meta"><span>${p.client}</span>${badge(p.status)}</div></div></div>`).join("")}
function filterProjects(){const q=document.getElementById("projectSearch").value.toLowerCase();document.getElementById("projectCards").innerHTML=projectCards(state.projects.filter(p=>(p.name+p.location+p.code).toLowerCase().includes(q)))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2800)}
function openModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalBackdrop").classList.add("show")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
function openProjectModal(){openModal("Create a project",`<form onsubmit="saveProject(event)"><div class="form-grid"><div class="form-group full"><label>Project name</label><input name="name" required placeholder="e.g. Central Business Tower"></div><div class="form-group"><label>Project code</label><input name="code" placeholder="BB-2026-004" required></div><div class="form-group"><label>Location</label><input name="location" placeholder="City, Country" required></div><div class="form-group"><label>Client / Developer</label><input name="client" required></div><div class="form-group"><label>Contract value (USD)</label><input name="value" type="number" min="1" required></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create project</button></div></form>`)}
function saveProject(e){e.preventDefault();const f=new FormData(e.target);state.projects.unshift({name:f.get("name"),code:f.get("code"),location:f.get("location"),client:f.get("client"),value:+f.get("value"),progress:0,status:"In progress"});closeModal();setPage("projects");toast("Project created in this demo workspace.")}
function openMilestoneModal(){openModal("Add payment milestone",`<form onsubmit="saveMilestone(event)"><div class="form-grid"><div class="form-group full"><label>Project</label><select name="project">${state.projects.map(p=>`<option>${p.name}</option>`).join("")}</select></div><div class="form-group full"><label>Milestone name</label><input name="name" required placeholder="e.g. Structural frame completion"></div><div class="form-group"><label>Payment amount (USD)</label><input name="amount" type="number" min="1" required></div><div class="form-group"><label>Target date</label><input name="date" type="date" required></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Add milestone</button></div></form>`)}
function saveMilestone(e){e.preventDefault();const f=new FormData(e.target);state.milestones.unshift({id:"MS-"+String(5+state.milestones.length).padStart(3,"0"),project:f.get("project"),name:f.get("name"),amount:+f.get("amount"),progress:0,status:"Pending",date:f.get("date")});closeModal();setPage("milestones");toast("Milestone added to the demo workspace.")}
function openBoqModal(){openModal("Add BOQ item",`<form onsubmit="saveBoq(event)"><div class="form-grid"><div class="form-group"><label>Item code</label><input name="code" required placeholder="BOQ-004"></div><div class="form-group"><label>Unit</label><input name="unit" required placeholder="m³"></div><div class="form-group full"><label>Description</label><input name="description" required></div><div class="form-group"><label>Quantity</label><input name="qty" type="number" min="0" required></div><div class="form-group"><label>Rate (USD)</label><input name="rate" type="number" min="0" required></div><div class="form-group full"><label>Project</label><select name="project">${state.projects.map(p=>`<option>${p.name}</option>`).join("")}</select></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save BOQ item</button></div></form>`)}
function saveBoq(e){e.preventDefault();const f=new FormData(e.target);state.boq.push({code:f.get("code"),unit:f.get("unit"),description:f.get("description"),qty:+f.get("qty"),rate:+f.get("rate"),project:f.get("project")});closeModal();setPage("boq");toast("BOQ item added to the demo workspace.")}
function approveMilestone(id){const m=state.milestones.find(x=>x.id===id);if(!m)return;m.status="Approved";state.payments.unshift({id:"PAY-"+(1025+state.payments.length),project:m.project,milestone:m.name,amount:m.amount,status:"Authorized",date:"18 Nov 2026",tx:"Demo authorization"});setPage("verification");toast("Demo approval recorded and payment authorization added.")}
function handleIfc(input){if(input.files[0])toast(`Selected ${input.files[0].name}. IFC parsing and 3D viewing will be implemented in the BIM integration sprint.`)}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
render();
</script>
</body>
</html>
